<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - Islam Homeo Pathic Clinic & Store</title>
    <!-- CSS ka link -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .form-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-add { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn-add:hover { background: #2980b9; }

        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Islam Homeo Pathic<br>Clinic & Store</h2>
        <a href="../dashboard.html">Dashboard</a>
        <a href="medicines.html">Medicines</a>
        <!-- Is page ka link highlight kiya gaya hai -->
        <a href="suppliers.html" style="background: #34495e; border-left: 4px solid #42b983;">Suppliers</a>
        <a href="purchases.html">Purchases</a>
        <a href="sales.html">Sales / Billing</a>
        <a href="expenses.html">Expenses</a>
        <a href="reports.html">Reports</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h2>Manage Suppliers</h2>
        </div>

        <!-- Add Supplier Form -->
        <div class="form-container">
            <h3>Add New Supplier</h3>
            <form id="addSupplierForm">
                <div class="form-grid">
                    <div class="form-group"><label>Supplier/Company Name</label><input type="text" id="supName" required></div>
                    <div class="form-group"><label>Contact Person</label><input type="text" id="supPerson"></div>
                    <div class="form-group"><label>Phone Number</label><input type="text" id="supPhone" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="supEmail"></div>
                    <div class="form-group"><label>Address</label><input type="text" id="supAddress" required></div>
                </div>
                <button type="submit" class="btn-add">Save Supplier</button>
            </form>
        </div>

        <!-- Suppliers Table -->
        <div class="table-container">
            <h3>Suppliers List</h3>
            <table>
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Contact Person</th>
                        <th>Phone Number</th>
                        <th>Email</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody id="suppliersList">
                    <!-- JavaScript se data yahan aayega -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JS Link - Yaad rahe file ka naam suppliers.js ho! -->
    <script type="module" src="../js/suppliers.js"></script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
